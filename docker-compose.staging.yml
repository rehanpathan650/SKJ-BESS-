# Staging on this PC. Same images and hardening as production, with these differences only:
#  * HTTPS via Caddy's internal CA at https://localhost:8443, bound to 127.0.0.1 (not reachable from the LAN)
#  * Mailpit catches all email (UI: http://127.0.0.1:8025); nothing is sent to real inboxes
#
#   docker compose -p skj-staging --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up -d --build
# (or simply: powershell -File infra\staging\staging.ps1 up)

x-staging-env: &staging-env
  ENVIRONMENT: staging
  CORS_ORIGINS: https://localhost:8443
  PUBLIC_BASE_URL: https://localhost:8443
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_STARTTLS: "false"
  SMTP_FROM: staging@skjenergy.com

services:
  proxy:
    ports: !override
      - "127.0.0.1:8443:443"
    volumes:
      - ./infra/caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro

  api:
    environment: *staging-env

  worker:
    environment: *staging-env

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp", "/data"]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8025:8025"]
    networks: [internal, edge]

# Production-style deployment. Only the Caddy reverse proxy publishes ports (80/443).
# PostgreSQL, Redis and ClamAV live on an internal network with no route to the internet.
#
#   cp .env.example .env      # then fill in every value
#   docker compose up -d --build
#   docker compose run --rm api alembic upgrade head
#   docker compose run --rm api python -m app.cli create-superadmin --email you@skjenergy.com --name "Your Name"

name: skj-bess

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DATABASE_URL: postgresql+psycopg://skj_app:${DB_APP_PASSWORD}@db:5432/skj?sslmode=require
  MIGRATION_DATABASE_URL: postgresql+psycopg://skj_owner:${DB_OWNER_PASSWORD}@db:5432/skj?sslmode=require
  JWT_SECRET: ${JWT_SECRET}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
  ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS}
  CORS_ORIGINS: https://${APP_DOMAIN}
  PUBLIC_BASE_URL: https://${APP_DOMAIN}
  COOKIE_SECURE: "true"
  TRUSTED_PROXY_COUNT: "1"
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CLAMAV_HOST: clamav
  REQUIRE_MALWARE_SCAN: "true"
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-100}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM: ${SMTP_FROM}
  PUSH_ENABLED: ${PUSH_ENABLED:-false}

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]
  restart: unless-stopped

services:
  proxy:
    image: caddy:2.10-alpine
    <<: *hardening
    cap_add: ["NET_BIND_SERVICE"]
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/site.caddy:/etc/caddy/site.caddy:ro
      - ./apps/web/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [api]

  api:
    build: ./apps/api
    <<: *hardening
    environment: *api-env
    volumes: [files:/data/storage]
    networks: [edge, internal]
    depends_on: [db, redis, clamav]

  worker:
    build: ./apps/api
    <<: *hardening
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true   # the worker serves no HTTP; the image's API health check does not apply
    environment: *api-env
    volumes: [files:/data/storage]
    # Needs outbound internet only for the Claude API, SMTP and Expo push.
    networks: [egress, internal]
    depends_on: [db, clamav]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: skj
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD}
    # Certificates are copied inside the container so the key has the 0600/postgres ownership PostgreSQL
    # demands, whatever the host filesystem (Linux or Windows/macOS Docker Desktop).
    entrypoint:
      - sh
      - -c
      - >
        mkdir -p /run/pgcerts && cp /certs/server.crt /certs/server.key /run/pgcerts/ &&
        chown -R postgres:postgres /run/pgcerts && chmod 600 /run/pgcerts/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/run/pgcerts/server.crt
        -c ssl_key_file=/run/pgcerts/server.key -c ssl_min_protocol_version=TLSv1.2
        -c password_encryption=scram-sha-256 -c log_connections=on -c log_disconnections=on
        -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/certs:/certs:ro
    networks: [internal]   # no published port: never reachable from the internet

  redis:
    image: redis:7.4-alpine
    <<: *hardening
    user: "999:1000"   # run as the image's redis user directly (no privilege switch needed with cap_drop ALL)
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    networks: [internal]

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes: [clamav:/var/lib/clamav]
    # Needs outbound access only to download virus signature updates.
    networks: [internal, egress]

networks:
  edge: {}
  egress: {}
  internal:
    internal: true

volumes:
  pgdata: {}
  files: {}
  clamav: {}
  caddy_data: {}
  caddy_config: {}

# Runs on every push/PR and weekly. A High/Critical finding fails the build.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Unit, access-control and API attack tests
        run: pytest -q
      - name: SAST (Bandit)
        run: bandit -r app -lll -iii
      - name: SAST (Ruff security rules)
        run: ruff check app --select S,B,E9,F --ignore S101,B008,B904
      - name: SCA (pip-audit)
        run: pip-audit -r requirements.txt --strict

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm --workspace apps/web run build
      - name: SCA (npm audit, production deps)
        run: npm audit --omit=dev --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx expo-doctor
      - name: SCA (npm audit)
        run: npm audit --omit=dev --audit-level=high

  semgrep:
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/owasp-top-ten --config p/python --config p/typescript --config p/secrets --error --severity ERROR

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t skj-api:ci apps/api
      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: skj-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: IaC / compose misconfiguration scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
